name: Aula UI
version: "1.9.55"
slug: aula-ui
description: >-
  A mobile-first, Reddit-style family feed for Aula posts, messages, presence
  and EasyIQ events, using Home Assistant's default AI for English summaries.
url: https://github.com/gyusza/ha-aula-ui
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: false
host_network: false
ingress: true
ingress_port: 8099
ingress_stream: false
panel_icon: mdi:forum
panel_title: Aula Feed
map:
  - type: homeassistant_config
    read_only: false
options:
  timezone: Europe/Copenhagen
  event_lookahead_days: 21
  thread_pages: 2
  log_level: info
  log_color: true
  access_team_domain: ""
  access_aud: ""
  access_allowed_emails: []
  public_url: ""
  mcp_key: ""
  mcp_allow_writes: false
schema:
  timezone: str
  event_lookahead_days: int(1,120)
  thread_pages: int(1,20)
  log_level: list(trace|debug|info|warning|error|fatal)
  log_color: bool
  access_team_domain: str?
  access_aud: str?
  access_allowed_emails:
    - email?
  public_url: str?
  mcp_key: password?
  mcp_allow_writes: bool?
  anthropic_api_key: password?
  anthropic_model: str?
  google_api_key: password?
  google_model: str?
  cloudflare_account_id: str?
  cloudflare_api_token: password?
  cloudflare_model: str?
